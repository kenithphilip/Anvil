<!doctype html>
<html lang="en" data-theme="dark" data-density="normal" data-rail="expanded">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anvil" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>Anvil</title>
    <!-- No third-party font host. Inter was fetched here on every page load
         and is referenced by NO font stack in the app (styles.css asks for IBM
         Plex Sans/Mono/Serif, which are now bundled from node_modules and
         served from our own origin). Removing it drops a render-blocking
         cross-origin request and stops handing every visitor's IP to a font
         CDN. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
